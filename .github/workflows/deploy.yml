name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/akshit-max/devops-ha-web-app:latest

  deploy:
    name: Deploy to EC2 via SSM
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111194324512:role/devops-ha-web-app-github-actions-role
          aws-region: ap-south-1

      - name: Deploy to EC2 Instances
        run: |
          COMMANDS='[
            "sudo docker pull ghcr.io/akshit-max/devops-ha-web-app:latest",
            "sudo docker stop devops-app || true",
            "sudo docker rm devops-app || true",
            "sudo docker run -d --name devops-app -p 5000:5000 --restart unless-stopped -e APP_VERSION=${{ github.sha }} ghcr.io/akshit-max/devops-ha-web-app:latest"
          ]'
          
          echo "Deploying via AWS Systems Manager..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=devops-ha-web-app-server-*" \
            --parameters "commands=$COMMANDS" \
            --query "Command.CommandId" \
            --output text)
            
          echo "Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."
          
          # Wait a few seconds for command to start execution
          sleep 5
          
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details

  verify:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Verify Health Check
        run: |
          # Replace with your actual ALB DNS Name if you want strict verification.
          # Here we just echo a success since it requires knowing the ALB DNS.
          echo "Deployment successful! Please verify the ALB /health endpoint in your browser."
